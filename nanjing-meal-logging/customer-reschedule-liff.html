  <script>/*
 * model.js — shared demo store (pure state logic, no UI).
 * Synthetic Meal Reschedule Demo per CONTRACT.md.
 * In-memory only: no storage, network, DOM, or external dependencies.
 * Source date is fixed at 2099-10-23 (not tied to the real calendar).
 */
'use strict';

var SOURCE_DATE = '2099-10-23';
var PACKAGE_EXPIRY = '2099-10-31';
var PACKAGE_LAST_RESCHEDULE_DATE = '2099-11-30';

/**
 * Strict real ISO calendar date check: exactly YYYY-MM-DD and a date
 * that actually exists (handles month lengths and leap years).
 */
function isRealISODate(value) {
  if (typeof value !== 'string') return false;
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
  if (!m) return false;
  var y = Number(m[1]);
  var mo = Number(m[2]);
  var d = Number(m[3]);
  if (mo < 1 || mo > 12) return false;
  var leap = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
  var daysInMonth = [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  return d >= 1 && d <= daysInMonth[mo - 1];
}

/** Deep copy of a meal array into detached, JSON-safe plain objects. */
function cloneMeals(meals) {
  var out = [];
  for (var i = 0; i < meals.length; i++) {
    out.push({ id: meals[i].id, slot: meals[i].slot, name: meals[i].name });
  }
  return out;
}

function createDemoStore() {
  // Internal state. Meal arrays are only ever exposed through clones.
  var mealsByDate = new Map();
  mealsByDate.set(SOURCE_DATE, [
    { id: 'L1', slot: '午餐', name: '香草雞腿飯' },
    { id: 'D1', slot: '晚餐', name: '菇菇豆腐飯' }
  ]);
  mealsByDate.set('2099-11-05', [
    { id: 'O1', slot: '晚餐', name: '鮭魚飯' }
  ]);

  var revision = 0;
  // eventId -> { target, meals } for successful moves (replay/conflict support).
  var eventBindings = new Map();

  function sourceMeals() {
    var meals = mealsByDate.get(SOURCE_DATE);
    return meals || [];
  }

  function buildResult(ok, code, message, target, meals) {
    return {
      ok: ok,
      code: code,
      message: message,
      source: SOURCE_DATE,
      target: target,
      meals: cloneMeals(meals && meals.length ? meals : [])
    };
  }

  /** Validate target only (no source check), no mutation. Returns error info or null. */
  function validateTarget(target) {
    if (target === undefined || target === null || target === '') {
      return { code: 'missing_target', message: '請選擇要改期到的日期。' };
    }
    if (!isRealISODate(target)) {
      return { code: 'invalid_date', message: '目標日期格式不正確，或不是實際存在的日期。' };
    }
    // Both sides are strict zero-padded ISO strings, so string order is date order.
    if (target < PACKAGE_EXPIRY) {
      return { code: 'before_package_expiry', message: '目標日期必須從包月最後一天 2099-10-31 起算。' };
    }
    if (target > PACKAGE_LAST_RESCHEDULE_DATE) {
      return { code: 'beyond_package_window', message: '目標日期不可超過包月最後一天後 30 天（2099-11-30）。' };
    }
    var occupied = mealsByDate.get(target);
    if (occupied && occupied.length > 0) {
      return { code: 'occupied', message: '目標日期已有餐點，請選擇其他日期。' };
    }
    return null;
  }

  function snapshot() {
    var days = {};
    mealsByDate.forEach(function (meals, date) {
      days[date] = cloneMeals(meals);
    });
    return { days: days, revision: revision };
  }

  function preview(target) {
    var err = validateTarget(target);
    if (err) {
      return buildResult(false, err.code, err.message, target, []);
    }
    var source = sourceMeals();
    if (source.length === 0) {
      return buildResult(false, 'empty_source', '來源日期 2099-10-23 已沒有可改期的餐點。', target, []);
    }
    return buildResult(true, 'ok', '改期預覽完成，將移動 ' + source.length + ' 道餐點。', target, source);
  }

  function confirm(target, eventId) {
    var validEvent = typeof eventId === 'string' && eventId.length > 0;

    // Successful binding takes precedence over revalidation so replay/conflict
    // work even after the source was emptied (and the target is now occupied).
    if (validEvent && eventBindings.has(eventId)) {
      var binding = eventBindings.get(eventId);
      if (binding.target === target) {
        return buildResult(true, 'replayed', '此事件先前已執行過，餐點不會再次移動。', target, binding.meals);
      }
      return buildResult(false, 'event_conflict', '此事件先前已綁定 ' + binding.target + '，無法改期至其他日期。', target, []);
    }

    if (!validEvent) {
      return buildResult(false, 'invalid_event', '缺少有效的事件代碼，未執行改期。', target, []);
    }

    // Revalidate exactly like preview(); on failure state stays untouched.
    var check = preview(target);
    if (!check.ok) {
      return buildResult(false, check.code, check.message, target, []);
    }

    // Atomic move: both source meals to target, source cleared, revision +1.
    var moved = sourceMeals();
    mealsByDate.set(SOURCE_DATE, []);
    mealsByDate.set(target, moved);
    revision += 1;
    eventBindings.set(eventId, { target: target, meals: cloneMeals(moved) });

    return buildResult(true, 'moved', '已將 ' + moved.length + ' 道餐點改期至 ' + target + '。', target, moved);
  }

  return {
    snapshot: snapshot,
    preview: preview,
    confirm: confirm
  };
}

// Browser global (regular <script>) and CommonJS export when available.
if (typeof globalThis !== 'undefined') {
  globalThis.createDemoStore = createDemoStore;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { createDemoStore: createDemoStore };
}
</script>

  <script>(() => {
  "use strict";
  const RUNTIME = globalThis.__RESCHEDULE_RUNTIME__ || null;
  const QUERY = new URLSearchParams(location.search);
  const LIVE = Boolean(RUNTIME);
  let SOURCE = QUERY.get("source_date") || "";
  let SOURCE_MEALS = [];
  let DATES = LIVE ? [] : ["2099-10-23", "2099-10-31", "2099-11-05", "2099-11-30"];
  let LABELS = {"2099-10-23":"目前排餐","2099-10-31":"包月最後一天","2099-11-05":"既有安排","2099-11-30":"最後可改日期"};
  const el = {
    count:document.querySelector("#meal-count"), schedule:document.querySelector("#schedule"),
    sourceSelect:document.querySelector("#source-date"), sourceChip:document.querySelector("#source-chip"),
    target:document.querySelector("#target-date"), preview:document.querySelector("#preview-button"),
    summary:document.querySelector("#preview-summary"), feedback:document.querySelector("#feedback"),
    reset:document.querySelector("#reset-button"), dialog:document.querySelector("#confirm-dialog"),
    source:document.querySelector("#dialog-source"), dialogTarget:document.querySelector("#dialog-target"),
    meals:document.querySelector("#dialog-meal-list"), cancel:document.querySelector("#cancel-button"),
    confirm:document.querySelector("#confirm-button")
  };
  let store = globalThis.createDemoStore();
  let idToken = null;
  let pending = null;
  let sequence = 0;
  let restoreFocus = false;

  const formatDate = (date) => date.split("-").join("/");
  const totalMeals = (days) => Object.values(days).reduce((sum, meals) => sum + meals.length, 0);

  function feedback(message = "", type = "") {
    el.feedback.textContent = message;
    el.feedback.className = `feedback${type ? ` ${type}` : ""}`;
    if (type === "success") el.feedback.setAttribute("role", "status");
    else el.feedback.removeAttribute("role");
  }

  function selectionSummary() {
    el.summary.textContent = el.target.value
      ? `從 ${formatDate(SOURCE)} 移到 ${el.target.selectedOptions[0].textContent.split("（")[0].trim()}`
      : "選擇日期後，可檢查改期內容";
  }

  function mealsMarkup(meals) {
    if (!meals.length) return '<p class="empty-day">這天目前沒有餐點</p>';
    return `<ul class="meal-list">${meals.map((meal) => `<li class="meal-card"><span class="meal-slot">${meal.slot}</span><span class="meal-name">${meal.name}</span></li>`).join("")}</ul>`;
  }

  function render() {
    const state = store.snapshot();
    el.count.textContent = String(totalMeals(state.days));
    if(el.sourceChip) el.sourceChip.textContent = formatDate(SOURCE);
    el.schedule.innerHTML = DATES.map((date) => {
      const meals = state.days[date] || [];
      return `<article class="day-card" data-date="${date}"><div class="day-card__header"><h3>${LABELS[date] || "目前排餐"}</h3><span class="day-card__date">${formatDate(date)}</span></div>${mealsMarkup(meals)}</article>`;
    }).join("");
    el.target.disabled = LIVE && !SOURCE;
    el.preview.disabled = (state.days[SOURCE] || []).length === 0;
    if (el.preview.disabled) el.summary.textContent = "來源日已無餐點，可重設後再次體驗";
    else selectionSummary();
  }

  async function openPreview() {
    feedback();
    if (LIVE) {
      try {
        const target = el.target.value;
        if (!target) { feedback("請選擇要改期到的日期。", "error"); return; }
        const response = await fetch(`/customer-reschedule/preview?order_id=${encodeURIComponent(QUERY.get("order_id"))}&source_date=${encodeURIComponent(SOURCE)}&target_date=${encodeURIComponent(target)}`, {headers:{"Authorization":`Bearer ${idToken}`},cache:"no-store",credentials:"omit"});
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.detail || "無法載入改期預覽");
        pending = {target, eventId:`meal-reschedule-${crypto.randomUUID()}`};
        el.source.textContent = formatDate(SOURCE);
        el.dialogTarget.textContent = formatDate(target);
        if (!Array.isArray(body.source_meals) || body.source_meals.length === 0 || body.source_meals.some((meal) => !(meal.slot && meal.name) && !String(meal.label || "").trim())) throw new Error("預覽資料缺少實際餐點內容");
        el.meals.replaceChildren(...body.source_meals.map((meal) => {const item=document.createElement("li");item.textContent = meal.slot && meal.name ? `${meal.slot}・${meal.name}` : `餐點・${meal.label}`;return item}));
        el.confirm.disabled = false;restoreFocus = true;el.dialog.showModal();el.cancel.focus();
      } catch (error) { feedback(error.message || "無法載入改期預覽", "error"); }
      return;
    }
    const result = store.preview(el.target.value);
    if (!result.ok) {
      pending = null;
      feedback(result.message, "error");
      return;
    }
    pending = {target:result.target, eventId:`meal-reschedule-${++sequence}`};
    el.source.textContent = formatDate(result.source);
    el.dialogTarget.textContent = formatDate(result.target);
    el.meals.innerHTML = result.meals.map((meal) => `<li>${meal.slot}・${meal.name}</li>`).join("");
    el.confirm.disabled = false;
    restoreFocus = true;
    el.dialog.showModal();
    el.cancel.focus();
  }

  function cancelPreview() {
    pending = null;
    el.dialog.close("cancel");
  }

  function submitRequest() {
    if (!pending || el.confirm.disabled) return;
    el.confirm.disabled = true;
    if (!LIVE) {
      const result = {ok:true, message:`已送出 ${formatDate(pending.target)} 改期申請，等待營養師核准。`};
      pending = null;
      el.dialog.close("submitted");
      feedback(result.message, "success");
      return;
    }
    fetch("/customer-reschedule/pending-request", {
      method:"POST",
      headers:{"Authorization":`Bearer ${idToken}`, "Content-Type":"application/json"},
      body:JSON.stringify({order_id:Number(QUERY.get("order_id")), source_date:SOURCE, target_date:pending.target, request_id:pending.eventId})
    }).then(async (response) => {
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.detail || "改期申請暫時無法處理");
      pending = null;
      el.dialog.close("submitted");
      feedback("已送出改期申請，等待營養師核准。", "success");
    }).catch((error) => {
      el.confirm.disabled = false;
      feedback(error.message, "error");
    });
  }

  function resetDemo() {
    if (el.dialog.open) {
      restoreFocus = false;
      el.dialog.close("reset");
    }
    store = globalThis.createDemoStore();
    pending = null;
    sequence = 0;
    el.target.value = "";
    el.confirm.disabled = false;
    feedback();
    render();
  }

  el.sourceSelect.addEventListener("change", () => {
    if(!LIVE) return;
    SOURCE = el.sourceSelect.value;
    const selected = el.sourceSelect.selectedOptions[0];
    SOURCE_MEALS = selected && selected.dataset.meals ? JSON.parse(selected.dataset.meals) : [];
    DATES = SOURCE ? [SOURCE] : [];
    if (SOURCE) LABELS[SOURCE] = selected.dataset.label || "目前排餐";
    el.target.value = "";
    pending = null;
    store = {snapshot:() => ({days: SOURCE ? {[SOURCE]: SOURCE_MEALS} : {}})};
    selectionSummary();
    render();
  });
  el.target.addEventListener("change", selectionSummary);
  el.preview.addEventListener("click", openPreview);
  el.cancel.addEventListener("click", cancelPreview);
  el.confirm.addEventListener("click", submitRequest);
  el.reset.addEventListener("click", resetDemo);
  el.dialog.addEventListener("cancel", () => { pending = null; });
  el.dialog.addEventListener("close", () => {
    if (restoreFocus) el.preview.focus();
    restoreFocus = false;
  });
  async function initLive() {
    if (!LIVE) { render(); return; }
    try {
      await liff.init({liffId:RUNTIME.liffId});
      if (!liff.isLoggedIn()) { liff.login(); return; }
      idToken = liff.getIDToken();
      if (!idToken) throw new Error("LINE 身份驗證尚未完成");
      if (!QUERY.get("order_id")) throw new Error("請從 LINE 的改期入口進入，缺少訂單資料");
      const response = await fetch("/customer-reschedule/context", {headers:{"Authorization":`Bearer ${idToken}`},cache:"no-store",credentials:"omit"});
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.detail || "無法載入改期選項");
      const order = (body.orders || []).find((item) => String(item.order_id) === QUERY.get("order_id"));
      const sourceChoices = order && (order.source_dates || []);
      const initialSource = sourceChoices.find((item) => item.date === SOURCE) || sourceChoices[0];
      if (!order || !initialSource) throw new Error("找不到可改期的訂單或來源日期");
      SOURCE = "";
      SOURCE_MEALS = [];
      DATES = [];
      el.sourceSelect.replaceChildren(new Option("請先選擇要改的排餐日期", ""));
      for (const item of sourceChoices) {
        const option = new Option(item.date + (item.label ? "・" + item.label : ""), item.date);
        option.dataset.label = item.label || "目前排餐";
        option.dataset.meals = JSON.stringify((item.meals || []).map((meal) => ({slot: meal.slot || "餐點", name: meal.name || "餐點內容未提供"})));
        el.sourceSelect.appendChild(option);
      }
      el.sourceSelect.value = "";
      el.target.replaceChildren(new Option("請先選擇來源日期", ""));
      for (const date of (order.target_dates || [])) el.target.appendChild(new Option(formatDate(date), date));
      el.reset.hidden = true;
      store = {snapshot:() => ({days:{}})};
      render();
      feedback("請先選擇要改的排餐日期，再選擇目標日期。", "success");
    } catch (error) {
      el.sourceSelect.replaceChildren(new Option("目前無法載入排餐", ""));
      el.sourceSelect.disabled = true;
      el.target.replaceChildren(new Option("請先完成排餐資料載入", ""));
      el.target.disabled = true;
      el.preview.disabled = true;
      feedback(error.message || "LINE 身份驗證失敗", "error");
    }
  }
  initLive();
})();
</script>
</body>
</html>
