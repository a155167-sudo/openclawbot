[build]
builder = "RAILPACK"

[deploy]
startCommand = "DIETITIAN_HEALTH_CHECK_DB_PATH=staging-data/deidentified.db uvicorn dietitian_health_check_staging:create_app --factory --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
